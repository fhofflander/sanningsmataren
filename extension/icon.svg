<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- Sanningsmätaren toolbar/store icon: a truth gauge -->
  <rect x="0" y="0" width="128" height="128" rx="28" fill="#1d4ed8"/>
  <!-- gauge arc -->
  <path d="M 26 84 A 38 38 0 0 1 102 84"
        fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round"/>
  <!-- needle pointing toward 'true' (upper right) -->
  <line x1="64" y1="84" x2="86" y2="56"
        stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>
  <!-- pivot -->
  <circle cx="64" cy="84" r="8" fill="#ffffff"/>
  <circle cx="64" cy="84" r="3.5" fill="#1d4ed8"/>
</svg>
