[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "debate-transcriber"
version = "0.1.0"
description = "Skapa talaridentifierade JSON-transkript från politiska debattvideor"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "openai>=1.109.0,<3",
  "pillow>=10,<13",
  "yt-dlp>=2025.7.21",
]

[project.optional-dependencies]
local = [
  "ctranslate2==4.4.0",
  "faster-whisper>=1.1.1,<2",
  "numpy>=1.26,<3",
  "nvidia-cublas-cu12==12.2.5.6; platform_system == 'Windows' and platform_machine == 'AMD64'",
  "nvidia-cuda-nvrtc-cu12==12.2.140; platform_system == 'Windows' and platform_machine == 'AMD64'",
  "nvidia-cudnn-cu12==8.9.7.29; platform_system == 'Windows' and platform_machine == 'AMD64'",
  "setuptools>=75,<81",
  "sherpa-onnx>=1.10.28,<2",
]
vision = [
  "numpy>=1.26,<3",
  "onnxruntime>=1.20,<2",
  "opencv-python>=4.10,<5",
  "rapidocr>=3.0,<4",
]

[project.scripts]
debate-transcriber = "debate_transcriber.cli:main"
debate-transcriber-gui = "debate_transcriber.gui:main"

[tool.setuptools.packages.find]
where = ["src"]
