[project]
name = "debatt"
version = "0.1.0"
description = "Sanningsmataren debate-analysis pipeline: ingest, transcribe and fact-check Swedish political debates"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
    "anthropic>=0.60",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
debatt = "debatt.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["debatt*"]
